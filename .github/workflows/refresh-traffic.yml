# Daily refresh of data/_traffic.json from GitHub + NuGet (token needed for Traffic API)
name: refresh-traffic

on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC daily (07:30 US Eastern)
  workflow_dispatch:
    inputs:
      token:
        description: "GitHub token with repo:read (for Traffic endpoints)"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Refresh traffic snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $token = if ($env:INPUT_TOKEN) { $env:INPUT_TOKEN } elseif ($env:GITHUB_TOKEN) { $env:GITHUB_TOKEN } else { "" }
          $headers = @{ "Accept" = "application/vnd.github+json" }
          if ($token) { $headers["Authorization"] = "Bearer $token" }
          $base = "https://api.github.com/repos/memoryfraction/Quant.Infra.Net"

          function Get-Json([string]$url) {
            (Invoke-WebRequest -Uri $url -Headers $headers -UseBasicParsing).Content | ConvertFrom-Json
          }

          $today = (Get-Date).ToUniversalTime().Date
          $from = $today.AddDays(-13)

          $snap = @{
            updatedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            repo = "memoryfraction/Quant.Infra.Net"
            nuget = "Quant.Infra.Net"
          }

          # --- GitHub Traffic (requires auth; skip gracefully without it) ---
          try {
            $clones  = Get-Json "$base/traffic/clones?per=day"
            $visitors = Get-Json "$base/traffic/unique-clones" 2>$null
          } catch { $clones = $null }

          if ($clones -and $clones.clones) {
            $snap["clones"] = @{
              total14d = $clones.total_clones
              uniqueCloners14d = $clones.unique_cloners
              daily = @($clones.clones | ForEach-Object {
                @{ date = [DateTimeOffset]::FromUnixTimeSeconds($_.timestamp).UtcDateTime.ToString("yyyy-MM-dd");
                   clones = $_.count; cloners = -1 }
              })
              note = "Refreshed automatically by GitHub Actions (exact, from GitHub Traffic API)."
            }
          }

          # --- NuGet download count ---
          # Primary: Azure Search endpoint (returns totalDownloads, same number as nuget.org website)
          # Fallback: catalog API per-version (packageDetails.downloadCount)
          $nugetDownloads = $null
          $nugetVersion = $null
          try {
              $search = Get-Json "https://azuresearch-usnc.nuget.org/query?q=packageid:quant.infra.net&prerelease=true"
              if ($search.data -and $search.data[0]) {
                  $nugetDownloads = [int]$search.data[0].totalDownloads
                  $nugetVersion = [string]$search.data[0].version
              }
          } catch { }
          # Fallback: resolve latest version from flatcontainer, then pull its catalog entry
          if (-not $nugetDownloads) {
              try {
                  $nugetInfo = Get-Json "https://api.nuget.org/v3-flatcontainer/quant.infra.net/index.json"
                  if ($nugetInfo.versions) {
                      $latest = $nugetInfo.versions | Select-Object -Last 1
                      $nugetVersion = if ($nugetVersion) { $nugetVersion } else { $latest }
                      $reg = (Invoke-WebRequest -Uri "https://api.nuget.org/v3/registration5-gz-semver2/quant.infra.net/index.json" -UseBasicParsing).Content | ConvertFrom-Json
                      $dl = ($reg.items | ForEach-Object { $_.items } | ForEach-Object {
                          if ($_.catalogEntry.packageDetails) { $_.catalogEntry }
                      }) | Select-Object -Last 1
                      if ($dl -and $dl.packageDetails) { $nugetDownloads = [int]$dl.packageDetails.downloadCount }
                  }
              } catch { }
          }
          if ($null -eq $nugetDownloads) { $nugetDownloads = 0 }

          $snap["nuget"] = @{
              downloads = $nugetDownloads
              version = if ($nugetVersion) { $nugetVersion } else { "1.5.1" }
              note = "Lifetime cumulative from NuGet API (azuresearch-usnc)."
          }

          # preserve substack + historical fields from existing file if present
          if (Test-Path "data/_traffic.json") {
            $existing = Get-Content "data/_traffic.json" -Raw | ConvertFrom-Json
            $snap["referringSites"] = $existing.referringSites
            $snap["popularContent"] = $existing.popularContent
            $snap["substack"] = $existing.substack
            $snap["visitors"] = $existing.visitors
          }

          $dir = Join-Path (Get-Location) "data"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $snap | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 (Join-Path $dir "_traffic.json")

      - name: Create branch, commit, and push
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet data/_traffic.json; then
            echo "No changes to data/_traffic.json - nothing to do."
            exit 0
          fi

          BRANCH="chore/traffic-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete old branch if exists, then create fresh
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          git add data/_traffic.json
          git commit -m "chore: refresh traffic snapshot $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"

          echo "Pushed to branch $BRANCH - create PR at:"
          echo "https://github.com/memoryfraction/Quant.Infra.Net/compare/main...$BRANCH?expand=1"
